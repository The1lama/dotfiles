
######################
###### Variable ######
######################

$font = FiraCode Nerd Font

######################
### General Monitor ##
######################


general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
    text_trim = false
}

animations {
    enabled = true
    # BEZIER is for the animation curves and the names used is the first text after the = 
    bezier = linear, 1, 1, 0, 0
    bezier = easeInExpo, 0.7, 0, 0.84, 0
    bezier = easeOutSine, 0.61, 1, 0.88, 1
    bezier = easeInOutQuart, 0.76, 0, 0.24, 1
    
    # where the animations should be played

      # fadeIn is the fade to lockscreen
    animation = fadeIn, 1, 5, linear
      # fadeOut is the fade to the wayland session
    animation = fadeOut, 1, 4, easeInOutQuart

    # Input Field
    animation = inputFieldColors, 1, 2, linear
    animation = inputFieldFade, 1, 1, easeInExpo
    animation = inputFieldWidth, 1, 0.8, easeInOutQuart
    animation = inputFieldDots, 1, 0.4, easeInExpo
}

background {
    monitor =
    path = ~/Pictures/wallpaper/spaceship1.jpg
    blur_passes = 2
}


######################
#### Main Monitor ####
######################

input-field {
    monitor = DP-1
    size = 20%, 5%
    outline_thickness = 2

    inner_color = rgba(235, 219, 178, 0.4) 

    outer_color = rgba(215,153,33,1) rgba(235,219,178,1) 200deg
    check_color = rgba(215,153,33,0.5) rgba(235,219,178,1) 120deg
    fail_color = rgba(204,34,34,1) rgba(235,219,178,1) 90deg

    font_color = rgba(28,28,28,0.9)
    fade_on_empty = true
    fade_timeout = 1500
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    dots_text_format = 
    dots_spacing = 0.3
    dot_center = true


    position = 0, -20
    halign = center
    valign = center
}

# Time-Hour
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = rgba(40,40,40,0.4)
    font_size = 125
    font_family = $font
    position = -55, 185
    halign = center
    valign = center
    zindex = 3

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(177,114,134)
    shadow_boost = 1.4
}

# Time-Minute
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = rgba(40,40,40,0.6)
    font_size = 125
    font_family = $font
    position = 0, 65
    halign = center
    valign = center
    zindex = 3

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(177,114,134)
    shadow_boost = 1.4
}

# Day-Month-Date
label {
    monitor = DP-1
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = rgba(40,40,40,1)
    font_size = 22
    font_family = $font
    position = -15, 50
    halign = center
    valign = center
    zindex = 3

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(177,114,134)
    shadow_boost = 1.4
}
